[project]
name = "board-api"
version = "0.1.0"
description = "RESTful 게시판 API (FastAPI + PostgreSQL + JWT)"
readme = "README.md"
authors = [
    { name = "imeab", email = "qodbals18@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.5",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
