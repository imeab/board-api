services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board}
      POSTGRES_DB: board
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 내 컴퓨터에서만 접속 가능 (외부 공개 X)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board"]
      interval: 3s
      retries: 10

  api:
    build: .
    restart: always
    env_file: .env
    environment:
      # 컨테이너끼리는 서비스 이름(db)으로 접속
      DATABASE_URL: postgresql+asyncpg://board:${POSTGRES_PASSWORD:-board}@db:5432/board
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
